<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1026"/>
      <stop offset="0.55" stop-color="#101b3d"/>
      <stop offset="1" stop-color="#1a2c58"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="candleGreen" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="candleGold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e09f1e"/>
      <stop offset="1" stop-color="#f5b301"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#glow)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="115" fill="none"
        stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- couronne O -->
  <circle cx="256" cy="258" r="166" fill="none" stroke="url(#ring)"
          stroke-width="34" stroke-linecap="round"/>

  <!-- ligne de base -->
  <line x1="168" y1="372" x2="352" y2="372" stroke="#ffffff" stroke-opacity="0.16"
        stroke-width="3" stroke-linecap="round"/>

  <!-- chandelier 1 -->
  <line x1="206" y1="292" x2="206" y2="362" stroke="#4ade80" stroke-opacity="0.85"
        stroke-width="9" stroke-linecap="round"/>
  <rect x="191" y="308" width="30" height="52" rx="6" fill="url(#candleGreen)"/>

  <!-- chandelier 2 -->
  <line x1="262" y1="240" x2="262" y2="338" stroke="#4ade80" stroke-opacity="0.85"
        stroke-width="9" stroke-linecap="round"/>
  <rect x="247" y="258" width="30" height="80" rx="6" fill="url(#candleGreen)"/>

  <!-- chandelier 3 (or) -->
  <line x1="318" y1="182" x2="318" y2="292" stroke="#f5b301" stroke-opacity="0.9"
        stroke-width="9" stroke-linecap="round"/>
  <rect x="303" y="202" width="30" height="60" rx="6" fill="url(#candleGold)"/>

  <!-- flèche montante (bénéfice) -->
  <path d="M372 118 L412 78 L404 78 L412 70 L420 78 L412 78"
        fill="none" stroke="#f5b301" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M398 96 L412 82 L426 96" fill="none" stroke="#f5b301"
        stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>