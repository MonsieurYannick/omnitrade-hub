name: Fabriquer l'installateur macOS

# ── Comment l'utiliser ──────────────────────────────────────────────────────
#  1. Onglet « Actions » → « Fabriquer l'installateur macOS » → « Run
#     workflow » (optionnel, pour un essai).
#  2. Plus simple : pousser le code puis un TAG vX.Y.Z (ex : v9.0).
#     Le tag déclenche LA Release : les .dmg (et .zip) y sont déposés
#     automatiquement, le bandeau « mise à jour » de l'app les annonce.
#
#  IMPORTANT : pensez à aligner « const APP={ version: 'X.Y.Z' } » dans
#  omnitrade-v21.html AVANT de pousser le tag — c'est cette valeur que
#  compare le bandeau de mise à jour.
#
#  Deux builds (matrix) → un installateur par architecture, nommé de façon
#  explicite pour que chacun sache quoi télécharger :
#    - OmniTradeHub-macOS-Intel.dmg          (Macs Intel / x86_64)
#    - OmniTradeHub-macOS-AppleSilicon.dmg   (Macs M1/M2/M3/M4 / arm64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex : 8.88) — vide : tag vX.Y.Z ou numéro du HTML"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Installateur macOS (${{ matrix.arch }}) (.dmg)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      VER: ${{ inputs.version }}
      VARIANT: ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: "Intel"
            arch: "Intel"
            runner: macos-13        # Apple Intel (x86_64)
          - variant: "AppleSilicon"
            arch: "Apple Silicon"
            runner: macos-14        # Apple Silicon (arm64)

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fabrication du .app + .dmg
        shell: bash
        run: bash build-ci-macos.sh

      - name: Artéfacts à télécharger
        uses: actions/upload-artifact@v4
        with:
          name: installateur-macos-${{ matrix.variant }}
          path: |
            OmniTradeHub-macOS-${{ matrix.variant }}.dmg
            OmniTradeHub-macOS-${{ matrix.variant }}-PRET.zip
          if-no-files-found: error

      - name: Publication sur la Release (Intel)
        if: matrix.variant == 'Intel' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OmniTradeHub-macOS-Intel.dmg
            OmniTradeHub-macOS-Intel-PRET.zip
          name: OmniTrade Hub v${{ github.ref_name }}
          body: |
            Nouvelle version disponible.

            **macOS — choisissez votre version ci-dessous ⬇️**

            | Votre Mac | Fichier |
            |---|---|
            | **Intel** (processeur Intel Core / Xeon) | `OmniTradeHub-macOS-Intel.dmg` |
            | **Apple Silicon** (puce M1 / M2 / M3 / M4) | `OmniTradeHub-macOS-AppleSilicon.dmg` |

            Comment savoir ? Menu  → **À propos de ce Mac** : « **Puce** » = Apple Silicon · « **Processeur** » = Intel.

            **Windows** — l'installateur `.exe` est ajouté automatiquement par le workflow « Fabriquer l'installateur Windows » sur le même tag.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publication sur la Release (Apple Silicon)
        if: matrix.variant == 'AppleSilicon' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OmniTradeHub-macOS-AppleSilicon.dmg
            OmniTradeHub-macOS-AppleSilicon-PRET.zip
          token: ${{ secrets.GITHUB_TOKEN }}
